<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Ticket Extractor</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 12px;
      min-width: 200px;
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 8px 12px;
      width: 100%;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font-size: 14px;
    }

    button:hover {
      background: #f5f5f5;
    }

    button:active {
      background: #e0e0e0;
    }

    button.primary {
      background: #0060df;
      color: white;
      border-color: #0060df;
    }

    button.primary:hover {
      background: #0050c5;
    }

    .settings {
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .settings select {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
    }

    .anonymize-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      box-sizing: border-box;
      width: 100%;
    }

    .anonymize-toggle input {
      cursor: pointer;
    }

    .anonymize-toggle.sub {
      margin-top: -8px;
      border-top: none;
      border-radius: 0 0 4px 4px;
      padding-left: 28px;
    }

    .anonymize-toggle.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      color: #333;
      white-space: pre-wrap;
    }

    .success {
      color: #008000;
    }

    .error {
      color: #d13212;
    }

    #status.hidden {
      display: none;
    }

    details {
      font-size: 12px;
    }

    details summary {
      cursor: pointer;
      color: #555;
    }

    details label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 8px;
    }

    details textarea {
      font: 12px ui-monospace, monospace;
      min-height: 64px;
      resize: vertical;
      box-sizing: border-box;
      width: 100%;
    }

    details .hint {
      color: #666;
    }
  </style>
</head>

<body>
  <label class="settings" for="copyFormat">
    <span>Format (clipboard and download)</span>
    <select id="copyFormat">
      <option value="json">JSON</option>
      <option value="text">Plain text (better for AI chats)</option>
    </select>
  </label>
  <label class="anonymize-toggle" for="anonymizeToggle">
    <input type="checkbox" id="anonymizeToggle">
    <span>Pseudonymize (names, mails, hosts, IPs, secrets)</span>
  </label>
  <label class="anonymize-toggle sub" for="keepAgentsToggle" id="keepAgentsLabel">
    <input type="checkbox" id="keepAgentsToggle">
    <span>Keep support agent first names</span>
  </label>
  <label class="anonymize-toggle" for="attachmentsToggle">
    <input type="checkbox" id="attachmentsToggle">
    <span>Download attachments (text logs, with the JSON)</span>
  </label>
  <label class="anonymize-toggle sub" for="binaryToggle" id="binaryLabel">
    <input type="checkbox" id="binaryToggle">
    <span>Also archives, images, PDFs (unchanged)</span>
  </label>
  <div class="button-row">
    <button id="copyBtn" class="primary">Copy to Clipboard</button>
    <button id="downloadJsonBtn">Download JSON</button>
  </div>
  <div id="status"></div>
  <details id="advanced">
    <summary>Advanced</summary>
    <label for="publicHosts">
      <span>Public hosts, URLs kept as they are</span>
      <textarea id="publicHosts" spellcheck="false"></textarea>
      <span class="hint">One per line; *.example.org also matches subdomains.</span>
    </label>
    <label for="internalDomains">
      <span>Internal domains, links become [internal-link-N]</span>
      <textarea id="internalDomains" spellcheck="false"></textarea>
      <span class="hint">Agents' mail domains count as internal too.</span>
    </label>
    <label for="protectedWords">
      <span>Protected words, never pseudonymized</span>
      <textarea id="protectedWords" spellcheck="false"></textarea>
      <span class="hint">Your company and product names, one per line. The agents' organization is added automatically.</span>
    </label>
  </details>
  <script src="browser-shim.js"></script>
  <script src="pseudonymize.js"></script>
  <script src="popup.js"></script>
</body>

</html>
